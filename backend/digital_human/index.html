<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>3D 数字人</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* 图2 背景层：深蓝底 + 数字人身后柔和环境光晕 + 向下长渐变过渡 */
  body {
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, rgba(120, 140, 180, 0.35) 0%, rgba(60, 85, 130, 0.18) 45%, transparent 70%),
      linear-gradient(180deg, #051d37 0%, #072344 42%, #37435e 62%, #8d8a94 78%, #cec5c8 90%, #d8cfd2 100%);
  }
  /* 数字人渲染层（全屏，人物放大贴近——图2 构图） */
  #sdk {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;  /* 半身构图：放大后裁掉下半身 */
  }
  #sdk canvas { width: 100% !important; height: 100% !important; }

  /* ============ 前景层（数字人区）============ */
  .fg-top {
    position: fixed; left: 0; top: 0; right: 0; height: 60vh;
    z-index: 100;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 24px 0;
    box-sizing: border-box;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    pointer-events: none;
    display: flex; flex-direction: column;
  }
  .fg-top > * { pointer-events: auto; }

  /* 顶栏：名字 + 状态（居中） */
  .topbar { display: flex; justify-content: center; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .brand-name {
    color: #fff; font-size: 19px; font-weight: 700; letter-spacing: 4px;
    text-shadow: 0 2px 12px rgba(0, 20, 45, 0.6);
  }
  .brand-state {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255, 255, 255, 0.85); font-size: 11px; letter-spacing: 2px;
  }
  .brand-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6fe3a6; box-shadow: 0 0 8px #6fe3a6;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .topbar .placeholder { width: 36px; }

  /* 中部弹性区：字幕卡 / 热线处置卡，底部对齐数字人区下沿 */
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding-bottom: 12px; }

  /* 字幕卡：数字人当前说的话 */
  .subtitle-card {
    display: none;
    flex-direction: column; align-items: center; gap: 7px;
    padding: 14px 20px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 10px 32px rgba(0, 25, 55, 0.28);
    animation: card-in 0.32s ease-out;
  }
  .subtitle-card.show { display: flex; }
  .subtitle-name { font-size: 11px; color: #54786e; font-weight: 700; letter-spacing: 3px; }
  .subtitle-text { font-size: 15px; color: #33312e; line-height: 1.65; text-align: center; }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* 热线处置卡（高危引导，文案按客户需求原文） */
  .hotline-card {
    display: none;
    flex-direction: column; align-items: center; gap: 8px;
    padding: 18px 22px; border-radius: 22px;
    background: #fff;
    box-shadow: 0 14px 40px rgba(0, 25, 55, 0.35);
    animation: card-in 0.32s ease-out;
  }
  .hotline-card.show { display: flex; }
  .hotline-tags { display: flex; gap: 8px; }
  .hotline-tag {
    padding: 4px 10px; border-radius: 999px; font-size: 10px;
    background: #edf5f1; color: #3c7a61;
  }
  .hotline-lead { font-size: 12.5px; color: #33312e; line-height: 1.7; text-align: center; max-width: 300px; }
  .hotline-org { font-size: 14px; color: #33312e; font-weight: 600; margin-top: 2px; }
  .hotline-phone { font-size: 21px; color: #d85a4a; font-weight: 800; letter-spacing: 1px; }
  .hotline-actions { display: flex; gap: 10px; margin-top: 6px; width: 100%; }
  .hotline-call {
    flex: 1; padding: 11px 0; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, #f2994a, #e8823a); color: #fff;
    font-size: 13.5px; font-weight: 700; letter-spacing: 1px;
  }
  .hotline-close {
    padding: 11px 18px; border: 0; border-radius: 14px;
    background: #f0ede6; color: #8a8578; font-size: 13.5px;
  }

  /* ============ 底部区：语音转写 + 按钮（背景由 body 渐变承担过渡）============ */
  .fg-bottom {
    position: fixed; left: 0; right: 0; bottom: 0; top: 46vh;
    z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    box-sizing: border-box;
    font-family: -apple-system, "PingFang SC", sans-serif;
    pointer-events: none;
  }

  /* 用户语音转写区：只显示当前一句（图2 大字号样式） */
  .asr-text {
    min-height: 60px;
    display: flex; align-items: center; justify-content: center;
    color: #1f1d1a; font-size: 21px; line-height: 1.55;
    text-align: center; width: 100%;
    font-weight: 600;
  }
  .asr-text.empty { color: #8a8578; font-size: 16px; font-weight: 400; }
  .asr-hint {
    color: #8a8578; font-size: 11px; letter-spacing: 1px;
  }
  /* 按钮视觉占位：与小程序 cover-view 按钮同位置同样式（真机被覆盖，工具可见） */
  .btn-visual {
    width: 100%;
    margin-top: 16px;
    padding: 15px 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #f2994a, #e87d2e);
    color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: 3px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(230, 120, 40, 0.4);
    box-sizing: border-box;
  }
  .btn-visual-text { pointer-events: none; }
  .btn-visual:active { transform: scale(0.97); }
  .asr-hint { margin-top: 12px; }

  /* ============ 状态提示 ============ */
  .hint {
    position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%);
    color: #fff; font-size: 13px; text-align: center; z-index: 50;
    line-height: 1.8; text-shadow: 0 2px 8px rgba(0,25,55,0.6);
  }
  .hint.error { color: #ffb4a6; }

  /* 调试状态条：版本 + 音频探针结果（真机截图即可确认，不依赖 vConsole） */
  #dbg {
    position: fixed; left: 8px; top: 8px; z-index: 9999;
    max-width: 90vw; padding: 4px 8px; border-radius: 6px;
    background: rgba(0,0,0,0.55); color: #9fe3a6;
    font: 11px/1.5 Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; pointer-events: none;
  }
</style>
</head>
<body>
<!-- 背景层：3D 数字人（上半屏 68%） -->
<div id="sdk"></div>
<div class="hint" id="hint">数字人正在唤醒中…</div>
<div id="dbg">v3 raw_audio</div>

<!-- 前景：数字人区（顶栏 + 字幕/热线卡 + 引导） -->
<div class="fg-top">
  <div class="topbar">
    
    <div class="brand">
      <div class="brand-name" id="brand-name">小满</div>
      <div class="brand-state"><div class="brand-dot"></div>正在陪你</div>
    </div>
    
  </div>
  <div class="mid">
    <!-- 热线处置卡（hash: hotline=show / hotline=hide） -->
    <div class="hotline-card" id="hotline-card">
      <div class="hotline-tags">
        <span class="hotline-tag">免费</span><span class="hotline-tag">匿名</span>
        <span class="hotline-tag">有人接</span><span class="hotline-tag">不评判</span>
      </div>
      <div class="hotline-lead" id="hotline-lead">我能感受到您现在的痛苦，和您聊天的同时，有一个 24 小时的心理支持热线 12356，有专业人员可以陪您聊一聊。</div>
      <div class="hotline-org">南京市总工会 宁师傅热线</div>
      <div class="hotline-phone">025-96889910</div>
      <div class="hotline-actions">
        <button class="hotline-call" id="hotline-call">联系宁师傅</button>
        <button class="hotline-close" id="hotline-close">知道了</button>
      </div>
    </div>
    <!-- 字幕卡（hash: speak=文本） -->
    <div class="subtitle-card" id="subtitle">
      <span class="subtitle-name" id="subtitle-name">小满</span>
      <span class="subtitle-text" id="subtitle-text"></span>
    </div>

  </div>
</div>

<!-- 前景：底部白色区（语音转写 + 按钮视觉占位） -->
<div class="fg-bottom">
  <div class="asr-text empty" id="asr-text"></div>
  <!-- 按钮视觉占位（真机被 cover-view 覆盖） -->
  <div class="btn-visual" id="btn-visual">
    <span class="btn-visual-text">按住开始说话</span>
  </div>
  <!-- 提示放按钮下面（用户要求，参考图1） -->
  <div class="asr-hint">放心聊，对话加密保护</div>
</div>

<script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js"></script>
<script>
/**
 * 沉浸式 3D 数字人对话页（方案 A · 倾诉页主形态）
 * —— 分层 ——
 *   背景层（0-68vh）：XmovAvatar 3D 数字人实时渲染
 *   前景层：顶栏（返回/名字/正在陪你）+ 字幕卡 + 热线处置卡 + 引导文案
 *            底部白色区（语音转写：只显示当前一句）
 *   按住说话按钮：小程序 cover-view 原生渲染（真机覆盖 web-view）
 * —— hash 指令协议（小程序 → H5，300ms 轮询）——
 *   #speak=<text>       数字人说话 + 字幕卡
 *   #asr=<text>|waiting 用户语音转写显示（单句覆盖）
 *   #hotline=show|hide  热线处置卡
 *   #back               返回小程序上一页
 */
(function () {
  var qs = new URLSearchParams(location.search);
  var appId = qs.get("appid") || "";
  var appSecret = qs.get("secret") || "";
  var dhName = qs.get("name") === "zhiyuan" ? "知远" : "小满";
  document.title = dhName + " · 3D 数字人";
  document.getElementById("brand-name").textContent = dhName;
  document.getElementById("subtitle-name").textContent = dhName;
  var hintEl = document.getElementById("hint");

  function setHint(text, isError) {
    hintEl.textContent = text;
    hintEl.className = "hint" + (isError ? " error" : "");
    hintEl.style.display = text ? "block" : "none";
  }


  // ---- 热线卡 ----
  var hotlineCard = document.getElementById("hotline-card");
  document.getElementById("hotline-call").addEventListener("click", function () {
    try { wx.miniProgram.postMessage({ data: { type: "call_hotline", phone: "025-96889910" } }); } catch (e) {}
    window.location.href = "tel:02596889910";
  });
  document.getElementById("hotline-close").addEventListener("click", function () {
    hotlineCard.classList.remove("show");
  });

  // ---- H5 按钮占位提示（开发者工具里 cover-view 不渲染，点此按钮提示真机体验）----
  var btnVisual = document.getElementById("btn-visual");
  if (btnVisual) {
    var tipTimer = null;
    btnVisual.addEventListener("click", function () {
      var t = document.getElementById("btn-visual-text");
      var orig = "按住开始说话";
      t.textContent = "语音对话请在真机体验";
      clearTimeout(tipTimer);
      tipTimer = setTimeout(function () { t.textContent = orig; }, 2000);
    });
  }

  // ---- 字幕 ----
  var subtitleCard = document.getElementById("subtitle");
  function showSubtitle(text) {
    document.getElementById("subtitle-text").textContent = text;
    subtitleCard.classList.add("show");
    clearTimeout(showSubtitle._t);
    showSubtitle._t = setTimeout(function () {
      subtitleCard.classList.remove("show");
    }, Math.min(6000 + text.length * 250, 15000));
  }

  // ---- 转写区（只显示当前一句）----
  var asrEl = document.getElementById("asr-text");
  function showAsr(text) {
    if (text === "waiting") {
      asrEl.textContent = "正在听清你说的每一个字…";
      asrEl.classList.add("empty");
    } else if (text) {
      asrEl.textContent = text;
      asrEl.classList.remove("empty");
    } else {
      asrEl.textContent = "";
      asrEl.classList.add("empty");
    }
  }

  if (!appId || !appSecret) {
    setHint("未配置数字人应用密钥（DH_APP_ID_FEMALE / DH_APP_ID_MALE）\\n请在 backend/.env 中填写后重启", true);
    return;
  }

  setHint(dhName + "正在唤醒中…（首次加载约 10-30 秒）");

  // ---- 打招呼状态机 ----
  // 修复：①旧代码用 onStateChange（Android SDK 回调名，Web SDK 无此回调）→ 永远收不到状态
  //       ②init.then 同步 speak 恰在连接过渡期，官方 FAQ 明确此时 speak 不生效 → 口播被丢弃
  //       ③微信 web-view 无用户手势时音频被挂起（autoplay 限制）→ 有字幕没声音
  // 策略：在线状态(status=0)后才打招呼 + 语音看门狗判定无声 + 首次手势补播
  var GREET_TEXT = "准备好了就开口，我一直在听。";
  var greetSent = false;          // 口播是否已发送
  var voiceHeard = false;         // 是否真正开始播放过语音（onVoiceStateChange start）
  var greetSilent = false;        // 判定无声，等待首次用户手势补播
  var conversationStarted = false; // 已开始对话（不再补播打招呼，避免打断回复）

  // ---- 音频自检探针（真机诊断用，结果同时显示在左上角 dbg 状态条，不依赖 vConsole）----
  // 目的：一次性区分 Android 无声的两类根因
  //   static-autoplay=BLOCKED → 自动播放被系统拦截（需用户手势）
  //   static-autoplay=OK 但 sdk-audio 不动 → SDK 音频通道在本机不可用
  var dbgLines = ["v3 raw_audio"];
  function dbg(line) {
    console.log("[audio-probe] " + line);
    dbgLines.push(line);
    if (dbgLines.length > 6) dbgLines.shift();
    var el = document.getElementById("dbg");
    if (el) el.textContent = dbgLines.join("\n");
  }
  var probeStaticDone = false;
  function probeStaticAudio() {
    if (probeStaticDone) return;
    probeStaticDone = true;
    // 1) 静态 wav 无手势自动播放测试
    try {
      var t = new Audio("probe_silence.wav");
      var p = t.play();
      if (p && p.then) {
        p.then(function () { dbg("static-autoplay=OK"); })
         .catch(function (e) { dbg("static-autoplay=BLOCKED:" + (e && e.name)); });
      } else {
        dbg("static-autoplay=legacy-ok");
      }
    } catch (e) { dbg("static-autoplay=ERR:" + e); }
    // 2) AudioContext 状态（raw_audio 通道依赖它，suspended = 被 autoplay 挂起）
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        var probeCtx = new AC();
        dbg("audioCtx=" + probeCtx.state);
        document.addEventListener("touchstart", function () {
          probeCtx.resume().then(function () {
            dbg("audioCtx-after-gesture=" + probeCtx.state);
          });
        }, { once: true });
      }
    } catch (e) { dbg("audioCtx=ERR:" + e); }
  }

  // 3) SDK 音频元素探测：打招呼 4 秒后检查是否真的在播
  function probeSdkAudio() {
    setTimeout(function () {
      var a = document.getElementById("xmov-avatar-audio");
      var info = a
        ? ("sdk-audio paused=" + a.paused + " ct=" + a.currentTime.toFixed(1) + " rs=" + a.readyState + " err=" + (a.error && a.error.code))
        : "sdk-audio none(raw_audio正常)";
      dbg(info);
    }, 4000);
  }

  function fireGreet() {
    if (greetSent) return;
    greetSent = true;
    window.dhSpeakLog = window.dhSpeakLog || [];
    window.dhSpeakLog.push({ t: Date.now(), text: "greet", src: "auto" });
    dbg("greet sent");
    sdk.speak(GREET_TEXT, true, true);
    showSubtitle(GREET_TEXT);
    setHint("");
    probeStaticAudio();
    probeSdkAudio();
    // 看门狗：3.5s 内没收到语音 start → 判定无声（autoplay 挂起 / 过渡期丢弃）
    setTimeout(function () {
      if (!voiceHeard && !conversationStarted) greetSilent = true;
    }, 3500);
  }

  // 首次 web-view 内用户手势：解锁音频，若打招呼无声则补播
  function onFirstGesture() {
    document.removeEventListener("touchstart", onFirstGesture, true);
    document.removeEventListener("click", onFirstGesture, true);
    if (greetSilent && !conversationStarted) {
      greetSilent = false;
      window.dhSpeakLog.push({ t: Date.now(), text: "greet", src: "gesture-retry" });
      sdk.speak(GREET_TEXT, true, true);
      showSubtitle(GREET_TEXT);
    }
  }
  document.addEventListener("touchstart", onFirstGesture, true);
  document.addEventListener("click", onFirstGesture, true);

  // #back 指令：返回小程序上一页（此前只调用未定义，补定义）
  function mpBack() {
    try { wx.miniProgram.navigateBack(); } catch (e) {}
  }

  var sdk = new XmovAvatar({
    containerId: "#sdk",
    appId: appId,
    appSecret: appSecret,
    gatewayServer: "https://nebula-agent.xingyun3d.com/user/v1/ttsa/session",
    hardwareAcceleration: "prefer-hardware",
    enableLogger: false,
    // 移动端音频通道：raw_audio=true 用 AudioWorklet 播 PCM（官方移动端推荐）；
    // 默认 false 走 MSE/WebM，Android 微信 webview 的 X5/旧内核不支持 MSE → 有动画没声音
    config: { raw_audio: true },
    // 数字人整体状态（数字枚举：0=在线 1=离线 4=关闭 5=可见 6=隐身）
    onStatusChange: function (status) {
      window.dhStates = window.dhStates || [];
      window.dhStates.push(String(status) + "@" + Date.now() % 100000);
      try {
        wx.miniProgram.postMessage({ data: { type: "dh_state", state: String(status) } });
      } catch (e) {}
      if (status === 0) {
        // 在线：此刻 speak 才可靠生效（官方 FAQ：过渡期 speak 不生效）
        try { wx.miniProgram.postMessage({ data: { type: "dh_ready" } }); } catch (e) {}
        fireGreet();
      }
    },
    // 渲染管线状态（init/rendering/pausing/paused/resumed/stopped）
    onRenderChange: function (state) {
      if (String(state) === "rendering" || String(state) === "resumed") {
        setHint("");
      }
    },
    // 说话状态（speak_start/speak_end/speak_error）：speak_error 视为无声
    onSpeakStateChange: function (state) {
      window.dhSpeakStates = window.dhSpeakStates || [];
      window.dhSpeakStates.push(String(state) + "@" + Date.now() % 100000);
      dbg("speak:" + String(state));
      if (String(state) === "speak_error" && !conversationStarted) greetSilent = true;
    },
    onMessage: function (message) {
      console.warn("SDK message:", message);
      try {
        wx.miniProgram.postMessage({ data: { type: "dh_error", code: message.code, msg: message.message } });
      } catch (e) {}
      if (message.code >= 10001 && message.code <= 10005) {
        setHint("数字人连接失败（" + message.code + "）：" + message.message, true);
      }
    },
    onNetworkInfo: function (info) { console.log("network:", info); },
    onVoiceStateChange: function (status) {
      if (String(status) === "start") {
        voiceHeard = true;
        greetSilent = false;
        dbg("voice=start");
      }
      try { wx.miniProgram.postMessage({ data: { type: "voice_state", status: String(status) } }); } catch (e) {}
    },
  });

  // ---- hash 指令轮询 ----
  var lastHash = "";
  function checkHash() {
    if (location.hash !== lastHash) {
      lastHash = location.hash;
      var cmd = decodeURIComponent(lastHash.replace(/^#/, "")) || "";
      var m;
      if ((m = /(?:^|&)speak=([\s\S]+)/.exec(cmd))) {
        var text = m[1];
        if (text) {
          conversationStarted = true;
          window.dhSpeakLog = window.dhSpeakLog || [];
          window.dhSpeakLog.push({ t: Date.now(), text: text.slice(0, 20) });
          sdk.speak(text, true, true);
          showSubtitle(text);
          setHint("");
        }
      } else if ((m = /(?:^|&)asr=([\s\S]*)/.exec(cmd))) {
        showAsr(m[1]);
      } else if (/hotline=show/.test(cmd)) {
        hotlineCard.classList.add("show");
      } else if (/hotline=hide/.test(cmd)) {
        hotlineCard.classList.remove("show");
      } else if (/(?:^|&)back$/.test(cmd)) {
        mpBack();
      }
    }
  }
  setInterval(checkHash, 300);

  // ---- 初始化 ----
  var initDone = false;
  sdk.init({
    initModel: "normal",
    onDownloadProgress: function (p) {
      if (!initDone) setHint(dhName + "资源加载 " + p + "%");
    },
  }).then(function () {
    initDone = true;
    setHint("");
    try { wx.miniProgram.postMessage({ data: { type: "dh_ready" } }); } catch (e) {}
    try { sdk.setVolume(1); } catch (e) {}
    // 兜底：5s 内没等到在线状态回调（个别版本不回调），仍按原时机打招呼
    setTimeout(function () { fireGreet(); }, 5000);
  }).catch(function (err) {
    initDone = true;
    setHint("数字人初始化失败：" + (err && (err.message || err)), true);
  });
})();
</script>
</body>
</html>
